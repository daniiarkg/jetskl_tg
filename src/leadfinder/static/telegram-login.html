<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Login</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      main { text-align: center; padding: 24px; }
      img {
        width: min(72vw, 520px);
        aspect-ratio: 1;
        padding: 18px;
        background: white;
        border-radius: 20px;
      }
      p { max-width: 620px; line-height: 1.5; }
      .status { color: #93c5fd; }
    </style>
  </head>
  <body>
    <main>
      <h1>Telegram Login</h1>
      <img id="qr" alt="Telegram login QR" />
      <p>Telegram → Настройки → Устройства → Подключить устройство</p>
      <p class="status" id="status">QR автоматически обновляется каждую секунду.</p>
    </main>
    <script>
      const qr = document.getElementById("qr");
      const status = document.getElementById("status");
      function refresh() {
        qr.src = `/data/telegram-login-live.png?t=${Date.now()}`;
        status.textContent = `Обновлено: ${new Date().toLocaleTimeString()}`;
      }
      qr.addEventListener("error", () => {
        status.textContent = "Ожидаю новый QR…";
      });
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
