name: leadfinder

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leadfinder
      POSTGRES_USER: leadfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadfinder -d leadfinder"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ../..
    env_file: ${LEADFINDER_ENV_FILE:-.env.production}
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    command: ["uvicorn", "leadfinder.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${LEADFINDER_PORT:-8000}:8000"
    volumes:
      - telegram_session:/app/.sessions
      - exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ../..
    env_file: ${LEADFINDER_ENV_FILE:-.env.production}
    command:
      [
        "leadfinder",
        "worker",
        "--profile",
        "jetski-miami",
        "--interval",
        "60",
        "--discover-every",
        "0",
      ]
    volumes:
      - telegram_session:/app/.sessions
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  telegram_session:
  exports:
