[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-leadfinder"
version = "1.3.0"
description = "Multi-source demand discovery with consent-aware lead qualification"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "qrcode[pil]>=8,<9",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "telethon>=1.44,<2",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.34,<1",
  "vercel>=0.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
leadfinder = "leadfinder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leadfinder"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "src.leadfinder.api:app"

[[tool.vercel.workflows]]
entrypoint = "src.leadfinder.workflows:wf"
